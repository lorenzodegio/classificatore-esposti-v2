# Temi per il fascicolo (vocabolario `tema` del contratto 1.1; l'elenco crescerà).
# Ogni tema ha una definizione che l'LLM legge per decidere. Il tema è una
# proposta: lo conferma l'operatore nell'applicazione.

[[tema]]
valore = "Cani"
definizione = "i fatti segnalati riguardano uno o più cani"

[[tema]]
valore = "Gatti e colonie feline"
definizione = "i fatti segnalati riguardano gatti o una colonia di gatti"

[[tema]]
valore = "Animali da reddito"
definizione = "i fatti segnalati riguardano animali tenuti per produzione (per esempio pollame, bovini, suini, ovini, caprini, conigli, equidi, api)"

[[tema]]
valore = "Avvelenamenti"
definizione = "i fatti segnalati riguardano veleno o il sospetto che animali siano stati avvelenati"
